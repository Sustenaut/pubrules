# SonarQube Cloud's analysis, into the project OWNER_REPO of the
# organization owner, in lower case (or pubrules.json's
# security.sonar.organization), when the caller passes a SONAR_TOKEN. Without one, as
# in a private repository or a pull request from a fork, it says so and
# passes. The full history lets it tell new code from old, and every
# coverage* artifact of the run, each in coverage-download/<artifact>/
# under the runner's temporary folder, outside the checkout, so the
# analysis never takes a report (an HTML one, say) for the repository's code,
# gives the coverage SonarQube Cloud's quality gate asks of new code: from
# coverage-run instead, when the tests ran there and not here. Each
# `property=pattern` in reports sends the files whose names match the
# pattern (find -name) to that property. layout, where the code and its
# tests are, which `pubrules sync` works out, comes first: sonar-args, then
# the properties pubrules.json adds (security.sonar.args), come after it, so
# a repository's own setting of the same property wins.
#
# One job of the CI `pubrules sync` writes from the ci block of pubrules.json
# (src/pubrules/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-sonar

on:
  workflow_call:
    inputs:
      runs-on: { type: string, default: ubuntu-latest, description: "The runner label the job runs on, from pubrules.json's ci.runs-on: a self-hosted runner scale set, or GitHub's ubuntu-latest." }
      sonar-args: { type: string, default: '', description: "Extra SonarQube Cloud properties, such as -Dsonar.exclusions=vendor/**." }
      layout: { type: string, default: '', description: "Where the code and its tests are, as SonarQube Cloud properties, such as -Dsonar.sources=src -Dsonar.tests=tests; pubrules sync gives it from the directories the repository has. sonar-args comes after it, so the repository's own wins." }
      coverage-run: { type: string, default: '', description: "Another run of this commit whose coverage artifacts to read, such as the merge queue's that a push to main skipped its tests for; the caller grants actions: read. Empty reads this run's." }
      reports: { type: string, required: true, description: "Where the coverage reports go: space-separated property=pattern pairs, such as sonar.rust.lcov.reportPaths=lcov.info sonar.python.coverage.reportPaths=*.xml." }
    secrets:
      SONAR_TOKEN: { required: false, description: "A SonarQube Cloud token: with it, the sonar job analyses the code. Pass it by name: secrets: inherit does not reach a workflow of another owner." }

jobs:
  sonar:
    runs-on: ${{ inputs.runs-on }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        # A pull request from a fork gets no secrets, by design: a notice.
        # Anything else got none because the caller passed none: a warning
        # naming the usual cause, since the job still passes.
        run: |
          if [ "$FORK" = true ]; then
            echo "::notice::No SONAR_TOKEN was passed, so SonarQube Cloud did not analyse this commit."
          else
            echo "::warning::No SONAR_TOKEN reached the sonar job, so SonarQube Cloud did not analyse this commit. Either the repository (or its organization) has no SONAR_TOKEN secret, or the caller passes it with secrets: inherit to a workflow of another owner, which GitHub drops; pass SONAR_TOKEN by name under the job's secrets."
          fi
        env: { FORK: '${{ github.event.pull_request.head.repo.fork || false }}' }
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: coverage*
          path: ${{ runner.temp }}/coverage-download
          run-id: ${{ inputs.coverage-run }}
          repository: ${{ github.repository }}
          github-token: ${{ inputs.coverage-run != '' && github.token || '' }}
      # The reports keep the file names the test commands gave them.
      - if: env.SONAR_TOKEN != ''
        id: report
        run: |
          set -f
          args=()
          for report in $REPORTS; do
            paths=$(find "$RUNNER_TEMP/coverage-download" -type f -name "${report#*=}" 2>/dev/null | paste -sd, -)
            args+=("-D${report%%=*}=$paths")
          done
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"
        env: { REPORTS: '${{ inputs.reports }}' }
      - if: env.SONAR_TOKEN != ''
        id: settings
        # The organization: security.sonar.organization, or the owner in
        # lower case, since SonarQube Cloud's organization keys are.
        run: |
          echo "args=$(jq -r '.security.sonar.args // ""' pubrules.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          organization=$(jq -r '.security.sonar.organization // ""' pubrules.json 2>/dev/null || true)
          echo "organization=${organization:-${OWNER,,}}" >> "$GITHUB_OUTPUT"
        env: { OWNER: '${{ github.repository_owner }}' }
      # A report a pull request committed would name any host for the gate
      # step to send SONAR_TOKEN to: only the scanner's own is read.
      - if: env.SONAR_TOKEN != ''
        run: rm -rf .scannerwork
      # The scan uploads the analysis and does not wait for the quality gate:
      # the next step asks for it, so a gate that failed and SonarQube Cloud
      # being unreachable, which the scanner reports alike, can be told apart.
      - if: env.SONAR_TOKEN != ''
        id: scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        continue-on-error: true
        with:
          args: >-
            -Dsonar.organization=${{ steps.settings.outputs.organization }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=false
            ${{ inputs.layout }}
            ${{ steps.report.outputs.args }}
            ${{ inputs.sonar-args }}
            ${{ steps.settings.outputs.args }}
      # What the analysis means for the job:
      #   - SonarQube Cloud answered and the gate failed (or it refused the
      #     query, or the scan itself was wrong while it answers): the job
      #     fails, whatever labels the pull request has. A finding is never
      #     bypassed.
      #   - SonarQube Cloud gave no answer after three tries (unreachable,
      #     5xx, or an analysis not done in five minutes): an outage. The job
      #     fails, unless the pull request carries the label sonar-down, which
      #     lets it pass with a warning and a note in the job's summary that
      #     the commit was not analysed. The next run on main analyses it.
      - if: env.SONAR_TOKEN != ''
        id: gate
        shell: bash
        env:
          SCAN: ${{ steps.scan.outcome }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_API: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          report=.scannerwork/report-task.txt
          timeout="${TIMEOUT:-300}"
          tries="${TRIES:-3}"
          pause="${PAUSE:-10}"
          body=""
          code=""
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          fail() { echo "::error::$*"; exit 1; }
          # One call to SonarQube Cloud: $code is the HTTP status, 000 for no
          # answer at all, and $body what came back.
          request() {
            local out
            if out="$(curl -sS --max-time 30 -u "$SONAR_TOKEN:" -w '\n%{http_code}' "$1" 2> /dev/null)"; then
              code="${out##*$'\n'}"
              body="${out%$'\n'*}"
            else
              code=000
              body=""
            fi
          }
          # request, again after a pause while there is no answer (000 or 5xx);
          # 1 when there never was one.
          ask() {
            local attempt
            for ((attempt = 1; attempt <= tries; attempt++)); do
              request "$1"
              if [[ "$code" != 000 && "$code" != 5* ]]; then return 0; fi
              if ((attempt < tries)); then sleep "$pause"; fi
            done
            return 1
          }
          # Whether the pull request this run is for carries sonar-down, read
          # now, never from the event: "Re-run failed jobs" replays the event
          # as it was, so a label added during the outage would not be seen.
          # A pull request's own number, or the pull requests merged into a
          # pushed commit. Any failure to read it counts as no label.
          labelled() {
            local names
            case "$EVENT" in
              pull_request | pull_request_target)
                names="$(curl -fsS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  "$GITHUB_API/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" 2> /dev/null | jq -r '.labels[]?.name' 2> /dev/null)" || return 1 ;;
              push)
                names="$(curl -fsS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  "$GITHUB_API/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" 2> /dev/null \
                  | jq -r '.[] | select(.merged_at != null) | .labels[]?.name' 2> /dev/null)" || return 1 ;;
              *) return 1 ;;
            esac
            grep -qix 'sonar-down' <<< "$names"
          }
          outage() {
            if labelled; then
              echo "::warning::SonarQube Cloud gave no answer ($1), and the pull request carries the label sonar-down: this commit was NOT analysed."
              say "### SonarQube Cloud was bypassed"
              say "SonarQube Cloud gave no answer ($1). The pull request carries the label \`sonar-down\`, so this job passed without an analysis. The next run on main, once SonarQube Cloud is back, analyses the code: look at its result."
              exit 0
            fi
            fail "SonarQube Cloud gave no answer ($1). If it is down, add the label sonar-down to the pull request and run the job again. The label counts only when SonarQube Cloud gives no answer, and never passes a failed gate."
          }
          server=https://sonarcloud.io
          # The scanner's report, which this job just made (the scan step's
          # folder was removed before it), still names only SonarQube Cloud.
          if [[ -f "$report" && "$(sed -n 's/^serverUrl=//p' "$report")" != "$server" ]]; then
            fail "$report names a server other than $server."
          fi
          if [[ ! -f "$report" ]]; then
            if [[ "$SCAN" == success ]]; then fail "The scan passed but wrote no $report."; fi
            # No analysis was accepted: SonarQube Cloud is either out of reach
            # (an outage) or there and refusing, or the scan was wrong. Any
            # answer, even a 404, shows it is there.
            if ask "$server/api/server/version"; then
              fail "The scan failed, and SonarQube Cloud answers ($code): see the scan step's log. Not an outage, so nothing is bypassed."
            fi
            outage "the scan failed and $server does not answer"
          fi
          task_url="$(sed -n 's/^ceTaskUrl=//p' "$report")"
          if [[ "$task_url" != "$server/"* ]]; then fail "$report names no ceTaskUrl at $server."; fi
          deadline=$((SECONDS + timeout))
          analysis=""
          while :; do
            ask "$task_url" || outage "$task_url does not answer"
            if [[ "$code" != 200 ]]; then fail "SonarQube Cloud refused the analysis task ($code)."; fi
            status="$(jq -r '.task.status // ""' <<< "$body")"
            case "$status" in
              SUCCESS) analysis="$(jq -r '.task.analysisId // ""' <<< "$body")"; break ;;
              FAILED | CANCELED) fail "SonarQube Cloud's analysis of this commit ended $status." ;;
            esac
            if ((SECONDS >= deadline)); then outage "the analysis was not done after ${timeout}s"; fi
            sleep "${POLL:-5}"
          done
          ask "$server/api/qualitygates/project_status?analysisId=$analysis" || outage "the quality gate does not answer"
          if [[ "$code" != 200 ]]; then fail "SonarQube Cloud refused the quality gate query ($code)."; fi
          gate="$(jq -r '.projectStatus.status // ""' <<< "$body")"
          case "$gate" in
            OK | WARN) echo "SonarQube Cloud's quality gate: $gate" ;;
            ERROR)
              failed="$(jq -r '[.projectStatus.conditions[]? | select(.status == "ERROR") | .metricKey] | join(", ")' <<< "$body")"
              fail "SonarQube Cloud's quality gate failed${failed:+ on: $failed}." ;;
            *) fail "SonarQube Cloud's quality gate is \"$gate\": a project's first analysis has no conditions to pass. Run the job again after it." ;;
          esac

# Reusable CI for a service: a repository that deploys rather than
# releases, and runs its secret-needing commands through ./with-secrets.
#
#   ci:
#     uses: Sustenaut/pubrules/.github/workflows/service-ci.yml@vX.Y.Z
#     with: { setup: make venv, test: .venv/bin/python -m pytest -q }
#     secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }
#
# Every job but sonar runs without secrets: tests that need one are the
# repository's to skip. The tests job gets the data reader app's client id
# and key only to read the data repository's cassettes, with data-repo.
# Public code is scanned by SonarQube Cloud, given a
# SONAR_TOKEN; without one, as in a private repository, sonar passes with a
# warning. Terraform is checked without a backend (fmt, init, validate), so
# no state or credentials are touched.
name: service-ci

on:
  workflow_call:
    inputs:
      runs-on: { type: string, default: ubuntu-latest, description: "The runner label the job runs on, from pubrules.json's ci.runs-on: a self-hosted runner scale set, or GitHub's ubuntu-latest." }
      python-version: { type: string, default: '3.14' }
      apt-packages: { type: string, default: '', description: "Extra Ubuntu packages to install first, from the Actions cache when an earlier run installed them (Sustenaut/pubactions/actions/apt-install)." }
      setup: { type: string, default: '', description: 'Prepares the tests, for example make venv. Empty skips it.' }
      test: { type: string, default: '', description: 'Runs the tests. Empty skips it.' }
      terraform-dir: { type: string, default: '', description: 'Where the Terraform files are. Empty skips the Terraform checks.' }
      shellcheck: { type: string, default: with-secrets, description: 'Shell scripts to check: space-separated globs.' }
      sync-check: { type: boolean, default: true, description: Fail if pubrules' managed files drifted. }
      coverage-report: { type: string, default: coverage/, description: "The coverage the test command writes, if any (Cobertura XML or LCOV lcov.info), which the sonar job reads." }
      sonar-args: { type: string, default: '', description: "Extra SonarQube Cloud properties for the sonar job, such as -Dsonar.exclusions=vendor/**." }
      data-repo: { type: boolean, default: false, description: "Check out the private <owner>/<repo>-data beside the checkout, where pubtest finds its cassettes, with a read-only token of the data reader app (DATA_APP_CLIENT_ID, DATA_APP_KEY); pubrules sync gives it from pubrules.json's \"pubtest\": {\"cassettes\": true}." }
    secrets:
      SONAR_TOKEN: { required: false, description: "A SonarQube Cloud token: with it, the sonar job analyses the code. Pass it by name: secrets: inherit does not reach a workflow of another owner." }
      DATA_APP_CLIENT_ID: { required: false, description: "The data reader GitHub App's client id (Iv...): with DATA_APP_KEY, it reads the data repository when data-repo is true. Pass it by name." }
      DATA_APP_KEY: { required: false, description: "The data reader GitHub App's private key (PEM)." }

jobs:
  checks:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ inputs.python-version }}' }
      - if: inputs.sync-check
        name: pubrules' managed files are in step
        run: |
          python3 -m venv .pubrules
          # Tried three times, then from the wheel mirror: a release download can time out.
          tests/install-lock .pubrules/bin/pip
          .pubrules/bin/pubrules sync --check
      - name: shell scripts pass shellcheck
        run: |
          shopt -s globstar nullglob
          files=($SCRIPTS)
          if [ ${#files[@]} -gt 0 ]; then shellcheck --severity=warning "${files[@]}"; fi
        env: { SCRIPTS: '${{ inputs.shellcheck }}' }

  terraform:
    if: inputs.terraform-dir != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_wrapper: false }
      - run: terraform -chdir="$DIR" fmt -check -recursive
        env: { DIR: '${{ inputs.terraform-dir }}' }
      # The provider mirror pubrules.json names (mirror.terraform), if any:
      # none, or no pubrules.json, gives no mirror try.
      - name: The provider mirror pubrules.json names
        id: mirror
        run: echo "terraform=$(jq -r '.mirror.terraform // empty' pubrules.json 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: terraform init, tried three times, then from the provider mirror
        uses: Sustenaut/pubactions/actions/terraform-init@b7e6571d667eaf4a2750e97691d55429d768ac9c # v0.1.0
        with:
          dir: ${{ inputs.terraform-dir }}
          args: -backend=false -input=false
          mirror: ${{ steps.mirror.outputs.terraform }}
      - run: terraform -chdir="$DIR" validate
        env: { DIR: '${{ inputs.terraform-dir }}' }

  tests:
    if: inputs.test != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # pubrules.json's "pubtest": {"cassettes": true}: pubtest's cassettes are
      # in the private <owner>/<repo>-data, which pubtest reads beside the
      # checkout, as on a developer's machine. The data reader app reads it
      # (contents and metadata read, nothing else), with a token for that one
      # repository that can only read its contents. A pull request from a
      # fork, or Dependabot's, gets no secrets, so the job fails saying why
      # rather than pass a suite it could not run.
      - if: inputs.data-repo
        id: data
        name: Check the data reader app can reach the data repository
        run: |
          repo="${GITHUB_REPOSITORY#*/}-data"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          if [ -n "$CLIENT_ID" ] && [ "$HAS_KEY" = true ]; then
            [[ "$CLIENT_ID" =~ ^Iv[A-Za-z0-9.]{4,}$ ]] && exit 0
            echo "::error title=DATA_APP_CLIENT_ID is not a client id::DATA_APP_CLIENT_ID must be the data reader app's client id, which starts Iv, then letters, digits and ., not its numeric app id."
            exit 1
          fi
          from=
          if [ "$HEAD" != "$GITHUB_REPOSITORY" ]; then from="the fork $HEAD"
          elif [ "$ACTOR" = 'dependabot[bot]' ]; then from=Dependabot; fi
          if [ -n "$from" ]; then
            echo "::error title=No cassettes for this pull request::It comes from $from, and GitHub gives it no secrets, so the data reader app cannot read $GITHUB_REPOSITORY_OWNER/$repo, where pubtest's cassettes are, and the suite cannot run. The job fails rather than pass untested: a maintainer runs the suite by pushing the branch to $GITHUB_REPOSITORY and opening the pull request from there."
            exit 1
          fi
          missing=$([ -n "$CLIENT_ID" ] || printf 'DATA_APP_CLIENT_ID '; [ "$HAS_KEY" = true ] || printf 'DATA_APP_KEY')
          echo "::error title=The data reader app's credentials did not reach this job::Missing: ${missing% }. pubrules.json's \"pubtest\": {\"cassettes\": true} reads pubtest's cassettes from the private $GITHUB_REPOSITORY_OWNER/$repo with the data reader app: its client id (a secret or a variable, starting Iv) as DATA_APP_CLIENT_ID and its private key (a secret) as DATA_APP_KEY. Set them as organization secrets selected for this repository, or on this repository with ./with-secrets ./pubsec app-secrets, from a github_app block whose client_id goes to DATA_APP_CLIENT_ID and key to DATA_APP_KEY."
          exit 1
        env:
          HEAD: '${{ github.event.pull_request.head.repo.full_name || github.repository }}'
          ACTOR: '${{ github.actor }}'
          CLIENT_ID: ${{ secrets.DATA_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.DATA_APP_KEY != '' }}
      - if: inputs.data-repo
        id: data-token
        name: Mint the data reader app's token, which can only read the data repository
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: '${{ secrets.DATA_APP_CLIENT_ID }}'
          private-key: '${{ secrets.DATA_APP_KEY }}'
          owner: '${{ github.repository_owner }}'
          repositories: '${{ steps.data.outputs.repo }}'
          permission-contents: read
      # actions/checkout keeps a path inside the workspace: the data repository
      # is checked out there, then moved beside it.
      - if: inputs.data-repo && steps.data-token.outcome == 'success'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: '${{ github.repository_owner }}/${{ steps.data.outputs.repo }}'
          token: '${{ steps.data-token.outputs.token }}'
          path: .pubrules-data
          persist-credentials: false
      - if: inputs.data-repo
        name: Put the data repository beside the checkout, where pubtest looks
        run: |
          if [ "$TOKEN" != success ]; then
            echo "::error title=No data repository::The data reader app could not read $GITHUB_REPOSITORY_OWNER/$REPO: there is no such repository, or the app is not installed on it. pubtest record --all --create-data-repo creates it, private, from a checkout beside it; then the app's installation must include it."
            exit 1
          fi
          beside="$(dirname "$GITHUB_WORKSPACE")/$(basename "$GITHUB_WORKSPACE")-data"
          rm -rf "$beside"
          mv .pubrules-data "$beside"
          echo "pubtest's cassettes: $beside/integrations/cassettes"
        env:
          TOKEN: '${{ steps.data-token.outcome }}'
          REPO: '${{ steps.data.outputs.repo }}'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ inputs.python-version }}' }
      # pip's and uv's download caches, keyed on the lock files: setup then
      # installs from the runner's disk instead of PyPI. Only downloads are
      # kept, never a venv, so a new Python patch release never meets an old
      # environment.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: service-tests-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('**/requirements*.lock', '**/requirements*.txt', '**/uv.lock') }}
          restore-keys: service-tests-${{ runner.os }}-py${{ inputs.python-version }}-
      - if: inputs.apt-packages != ''
        name: Install the apt packages, kept in the Actions cache
        uses: Sustenaut/pubactions/actions/apt-install@b7e6571d667eaf4a2750e97691d55429d768ac9c # v0.1.0
        with: { packages: '${{ inputs.apt-packages }}' }
      - if: inputs.setup != ''
        name: Set up, tried three times (a release download can time out)
        uses: Sustenaut/pubactions/actions/retry@b7e6571d667eaf4a2750e97691d55429d768ac9c # v0.1.0
        with: { run: '${{ inputs.setup }}' }
      - run: ${{ inputs.test }}
      # The sonar job runs elsewhere, so the report goes to it as an artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: coverage
          path: ${{ inputs.coverage-report }}
          if-no-files-found: ignore
          retention-days: 1

  sonar:
    needs: [tests]
    # It waits for the tests, so their coverage counts; when no test was
    # asked for, that job is skipped.
    if: always() && contains(fromJSON('["success", "skipped"]'), needs.tests.result)
    runs-on: ${{ inputs.runs-on }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        # A pull request from a fork gets no secrets, by design: a notice.
        # Anything else got none because the caller passed none: a warning
        # naming the usual cause, since the job still passes.
        run: |
          if [ "$FORK" = true ]; then
            echo "::notice::No SONAR_TOKEN was passed, so SonarQube Cloud did not analyse this commit."
          else
            echo "::warning::No SONAR_TOKEN reached the sonar job, so SonarQube Cloud did not analyse this commit. Either the repository (or its organization) has no SONAR_TOKEN secret, or the caller passes it with secrets: inherit to a workflow of another owner, which GitHub drops; pass SONAR_TOKEN by name under the job's secrets."
          fi
        env: { FORK: '${{ github.event.pull_request.head.repo.fork || false }}' }
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: coverage*
          path: coverage-download
      # Properties pubrules.json adds (security.sonar.args), after the input's.
      - if: env.SONAR_TOKEN != ''
        id: settings
        # The organization: security.sonar.organization, or the owner in
        # lower case, since SonarQube Cloud's organization keys are.
        run: |
          echo "args=$(jq -r '.security.sonar.args // ""' pubrules.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          organization=$(jq -r '.security.sonar.organization // ""' pubrules.json 2>/dev/null || true)
          echo "organization=${organization:-${OWNER,,}}" >> "$GITHUB_OUTPUT"
        env: { OWNER: '${{ github.repository_owner }}' }
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: >-
            -Dsonar.organization=${{ steps.settings.outputs.organization }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.python.coverage.reportPaths=coverage-download/**/*.xml
            -Dsonar.javascript.lcov.reportPaths=coverage-download/**/lcov.info
            ${{ inputs.sonar-args }}
            ${{ steps.settings.outputs.args }}

  # The one check a ruleset would require. Private repositories on GitHub
  # Free have no rulesets, so there it is a summary to read, not a gate.
  # A skipped job counts as passing; terraform and tests may be skipped only
  # when not asked for.
  passed:
    if: always()
    needs: [checks, terraform, tests, sonar]
    runs-on: ${{ inputs.runs-on }}
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg tf "$TF" --arg test "$TEST" '
            all(to_entries[];
                .value.result == "success"
                or (.key == "terraform" and $tf == "" and .value.result == "skipped")
                or (.key == "tests" and $test == "" and .value.result == "skipped"))' > /dev/null
        env:
          RESULTS: '${{ toJSON(needs) }}'
          TF: '${{ inputs.terraform-dir }}'
          TEST: '${{ inputs.test }}'

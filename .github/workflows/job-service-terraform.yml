# A service's Terraform, checked without a backend (fmt, init, validate),
# so no state or credentials are touched.
#
# One job of the CI `pubrules sync` writes from the ci block of pubrules.json
# (src/pubrules/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-service-terraform

on:
  workflow_call:
    inputs:
      runs-on: { type: string, default: ubuntu-latest, description: "The runner label the job runs on, from pubrules.json's ci.runs-on: a self-hosted runner scale set, or GitHub's ubuntu-latest." }
      terraform-dir: { type: string, required: true, description: Where the Terraform files are. }

jobs:
  terraform:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_wrapper: false }
      - run: terraform -chdir="$DIR" fmt -check -recursive
        env: { DIR: '${{ inputs.terraform-dir }}' }
      # The provider mirror pubrules.json names (mirror.terraform), if any:
      # none, or no pubrules.json, gives no mirror try.
      - name: The provider mirror pubrules.json names
        id: mirror
        run: echo "terraform=$(jq -r '.mirror.terraform // empty' pubrules.json 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: terraform init, tried three times, then from the provider mirror
        uses: Sustenaut/pubactions/actions/terraform-init@b7e6571d667eaf4a2750e97691d55429d768ac9c # v0.1.0
        with:
          dir: ${{ inputs.terraform-dir }}
          args: -backend=false -input=false
          mirror: ${{ steps.mirror.outputs.terraform }}
      - run: terraform -chdir="$DIR" validate
        env: { DIR: '${{ inputs.terraform-dir }}' }

# Node: the locked dependencies without their install scripts, pubrules sync
# --check, and the tests, whose coverage report goes to the sonar job as the
# `coverage` artifact. fast-check property tests try PUBRULES_FUZZ_RUNS inputs
# each: fuzz-runs, or fuzz-runs-scheduled on a schedule.
#
# One job of the CI `pubrules sync` writes from the ci block of pubrules.json
# (src/pubrules/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-node-test

on:
  workflow_call:
    inputs:
      runs-on: { type: string, default: ubuntu-latest, description: "The runner label the job runs on, from pubrules.json's ci.runs-on: a self-hosted runner scale set, or GitHub's ubuntu-latest." }
      node-version: { type: string, default: '22' }
      python-version: { type: string, default: '3.14', description: For pubrules sync --check. }
      apt-packages: { type: string, default: '', description: Extra Ubuntu packages to install first. }
      setup: { type: string, default: npm ci --ignore-scripts --no-audit --no-fund, description: Installs the locked dependencies. }
      test: { type: string, default: npm test, description: Runs the tests. }
      sync-check: { type: boolean, default: true, description: "Fail if pubrules' managed files drifted, using the pubrules tests/requirements.lock pins." }
      coverage-report: { type: string, default: coverage/lcov.info, description: "The LCOV report the test command writes, if any, which the sonar job reads: node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage/lcov.info writes one." }
      fuzz-runs: { type: string, default: '100', description: "Inputs each property test tries (PUBRULES_FUZZ_RUNS)." }
      fuzz-runs-scheduled: { type: string, default: '10000', description: "Inputs each property test tries on a scheduled run." }
      data-repo: { type: boolean, default: false, description: "Check out the private <owner>/<repo>-data beside the checkout, where pubtest finds its cassettes, with a read-only token of the release app (RELEASE_APP_ID, RELEASE_APP_KEY); pubrules sync gives it from pubrules.json's \"pubtest\": {\"cassettes\": true}." }
    secrets:
      RELEASE_APP_ID: { required: false, description: "The release GitHub App's id: with RELEASE_APP_KEY, it reads the data repository when data-repo is true. Pass it by name." }
      RELEASE_APP_KEY: { required: false, description: "The release GitHub App's private key (PEM)." }

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # pubrules.json's "pubtest": {"cassettes": true}: pubtest's cassettes are
      # in the private <owner>/<repo>-data, which pubtest reads beside the
      # checkout, as on a developer's machine. The release app reads it, with a
      # token for that one repository that can only read its contents. A pull
      # request from a fork, or Dependabot's, gets no secrets, so the job fails
      # saying why rather than pass a suite it could not run.
      - if: inputs.data-repo
        id: data
        name: Check the release app can reach the data repository
        run: |
          repo="${GITHUB_REPOSITORY#*/}-data"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          [ "$HAS_ID" = true ] && [ "$HAS_KEY" = true ] && exit 0
          from=
          if [ "$HEAD" != "$GITHUB_REPOSITORY" ]; then from="the fork $HEAD"
          elif [ "$ACTOR" = 'dependabot[bot]' ]; then from=Dependabot; fi
          if [ -n "$from" ]; then
            echo "::error title=No cassettes for this pull request::It comes from $from, and GitHub gives it no secrets, so the release app cannot read $GITHUB_REPOSITORY_OWNER/$repo, where pubtest's cassettes are, and the suite cannot run. The job fails rather than pass untested: a maintainer runs the suite by pushing the branch to $GITHUB_REPOSITORY and opening the pull request from there."
            exit 1
          fi
          missing=$([ "$HAS_ID" = true ] || printf 'RELEASE_APP_ID '; [ "$HAS_KEY" = true ] || printf 'RELEASE_APP_KEY')
          echo "::error title=The release app's credentials did not reach this job::Missing: ${missing% }. pubrules.json's \"pubtest\": {\"cassettes\": true} reads pubtest's cassettes from the private $GITHUB_REPOSITORY_OWNER/$repo with the release app: its id (a secret or a variable) as RELEASE_APP_ID and its private key (a secret) as RELEASE_APP_KEY. Set them as organization secrets that reach this repository (on GitHub Free those reach public repositories only), or on this repository with ./with-secrets ./pubsec app-secrets, from a github_app block whose id goes to RELEASE_APP_ID and key to RELEASE_APP_KEY."
          exit 1
        env:
          HEAD: '${{ github.event.pull_request.head.repo.full_name || github.repository }}'
          ACTOR: '${{ github.actor }}'
          HAS_ID: ${{ secrets.RELEASE_APP_ID != '' }}
          HAS_KEY: ${{ secrets.RELEASE_APP_KEY != '' }}
      - if: inputs.data-repo
        id: data-token
        name: Mint the release app's token, which can only read the data repository
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: '${{ secrets.RELEASE_APP_ID }}'
          private-key: '${{ secrets.RELEASE_APP_KEY }}'
          owner: '${{ github.repository_owner }}'
          repositories: '${{ steps.data.outputs.repo }}'
          permission-contents: read
      # actions/checkout keeps a path inside the workspace: the data repository
      # is checked out there, then moved beside it.
      - if: inputs.data-repo && steps.data-token.outcome == 'success'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: '${{ github.repository_owner }}/${{ steps.data.outputs.repo }}'
          token: '${{ steps.data-token.outputs.token }}'
          path: .pubrules-data
          persist-credentials: false
      - if: inputs.data-repo
        name: Put the data repository beside the checkout, where pubtest looks
        run: |
          if [ "$TOKEN" != success ]; then
            echo "::error title=No data repository::The release app could not read $GITHUB_REPOSITORY_OWNER/$REPO: there is no such repository, or the app is not installed on it. pubtest record --all --create-data-repo creates it, private, from a checkout beside it; then the app's installation must include it."
            exit 1
          fi
          beside="$(dirname "$GITHUB_WORKSPACE")/$(basename "$GITHUB_WORKSPACE")-data"
          rm -rf "$beside"
          mv .pubrules-data "$beside"
          echo "pubtest's cassettes: $beside/integrations/cassettes"
        env:
          TOKEN: '${{ steps.data-token.outcome }}'
          REPO: '${{ steps.data.outputs.repo }}'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ inputs.node-version }}' }
      - if: inputs.sync-check
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ inputs.python-version }}' }
      - if: inputs.sync-check
        run: |
          python -m venv .venv
          # Tried three times, then from the wheel mirror: a release download can time out.
          tests/install-lock .venv/bin/pip
          .venv/bin/pubrules sync --check
      - if: inputs.apt-packages != ''
        name: Install the apt packages, kept in the Actions cache
        uses: Sustenaut/pubactions/actions/apt-install@b7e6571d667eaf4a2750e97691d55429d768ac9c # v0.1.0
        with: { packages: '${{ inputs.apt-packages }}' }
      - name: Set up, tried three times (a release download can time out)
        uses: Sustenaut/pubactions/actions/retry@b7e6571d667eaf4a2750e97691d55429d768ac9c # v0.1.0
        with: { run: '${{ inputs.setup }}' }
      # Each property test (Hypothesis, fast-check) tries PUBRULES_FUZZ_RUNS
      # inputs. A scheduled run tries more, unless pubrules.json sets
      # "security": { "fuzz": { "node": false } }.
      - run: |
          runs=$SHORT
          if [ "$EVENT" = schedule ] && [ "$(jq '.security.fuzz | (if type == "object" then .node else . end) != false' pubrules.json 2>/dev/null || echo true)" = true ]; then
            runs=$LONG
          fi
          echo "PUBRULES_FUZZ_RUNS=$runs" >> "$GITHUB_ENV"
        env:
          EVENT: '${{ github.event_name }}'
          SHORT: '${{ inputs.fuzz-runs }}'
          LONG: '${{ inputs.fuzz-runs-scheduled }}'
      - run: ${{ inputs.test }}
      # The sonar job runs elsewhere, so the report goes to it as an artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: coverage
          path: ${{ inputs.coverage-report }}
          if-no-files-found: ignore
          retention-days: 1

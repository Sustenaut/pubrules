# Reusable CI for a Node package:
#
#   ci:
#     uses: Sustenaut/pubrules/.github/workflows/node-ci.yml@vX.Y.Z
#     with: { browser-test: npm run test:browser }
#     secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }
#
# Dependencies install from package-lock.json without running their install
# scripts, and npx runs only what that installed, so a compromised package
# cannot run code just by being installed. The commands are inputs; the
# defaults are npm's own.
#
# fast-check property tests try PUBRULES_FUZZ_RUNS inputs each, given a setup
# file the test command loads that calls
#   fc.configureGlobal({ numRuns: Number(process.env.PUBRULES_FUZZ_RUNS) || 100 })
# fuzz-runs on every push and pull request, fuzz-runs-scheduled on a
# schedule (security.fuzz.node in pubrules.json).
#
# The audit job checks every locked package, development ones included,
# against npm's advisories on every run, nightly included, and fails on any
# finding. It has no switch.
name: node-ci

on:
  workflow_call:
    inputs:
      runs-on: { type: string, default: ubuntu-latest, description: "The runner label the job runs on, from pubrules.json's ci.runs-on: a self-hosted runner scale set, or GitHub's ubuntu-latest." }
      node-version: { type: string, default: '22' }
      python-version: { type: string, default: '3.14', description: For pubrules sync --check. }
      apt-packages: { type: string, default: '', description: Extra Ubuntu packages to install first. }
      setup: { type: string, default: npm ci --ignore-scripts --no-audit --no-fund, description: Installs the locked dependencies. }
      test: { type: string, default: npm test, description: Runs the tests. }
      browser-test: { type: string, default: '', description: Runs the browser tests too; empty skips the browser job. }
      browser-setup: { type: string, default: npx --no-install playwright install --with-deps chromium }
      browser-coverage-report: { type: string, default: coverage/, description: "The coverage the browser test command writes, if any, which the sonar job reads with the test job's report." }
      sync-check: { type: boolean, default: true, description: "Fail if pubrules' managed files drifted, using the pubrules tests/requirements.lock pins." }
      sonar-args: { type: string, default: '', description: "Extra SonarQube Cloud properties for the sonar job, such as -Dsonar.exclusions=vendor/**." }
      coverage-report: { type: string, default: coverage/lcov.info, description: "The LCOV report the test command writes, if any, which the sonar job reads: node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage/lcov.info writes one." }
      fuzz-runs: { type: string, default: '100', description: "Inputs each property test tries (PUBRULES_FUZZ_RUNS)." }
      fuzz-runs-scheduled: { type: string, default: '10000', description: "Inputs each property test tries on a scheduled run." }
      data-repo: { type: boolean, default: false, description: "Check out the private <owner>/<repo>-data beside the checkout, where pubtest finds its cassettes, with a read-only token of the release app (RELEASE_APP_ID, RELEASE_APP_KEY); pubrules sync gives it from pubrules.json's \"pubtest\": {\"cassettes\": true}." }
    secrets:
      SONAR_TOKEN: { required: false, description: "A SonarQube Cloud token: with it, the sonar job analyses the code. Pass it by name: secrets: inherit does not reach a workflow of another owner." }
      RELEASE_APP_ID: { required: false, description: "The release GitHub App's id: with RELEASE_APP_KEY, it reads the data repository when data-repo is true. Pass it by name." }
      RELEASE_APP_KEY: { required: false, description: "The release GitHub App's private key (PEM)." }

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # pubrules.json's "pubtest": {"cassettes": true}: pubtest's cassettes are
      # in the private <owner>/<repo>-data, which pubtest reads beside the
      # checkout, as on a developer's machine. The release app reads it, with a
      # token for that one repository that can only read its contents. A pull
      # request from a fork, or Dependabot's, gets no secrets, so the job fails
      # saying why rather than pass a suite it could not run.
      - if: inputs.data-repo
        id: data
        name: Check the release app can reach the data repository
        run: |
          repo="${GITHUB_REPOSITORY#*/}-data"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          [ "$HAS_ID" = true ] && [ "$HAS_KEY" = true ] && exit 0
          from=
          if [ "$HEAD" != "$GITHUB_REPOSITORY" ]; then from="the fork $HEAD"
          elif [ "$ACTOR" = 'dependabot[bot]' ]; then from=Dependabot; fi
          if [ -n "$from" ]; then
            echo "::error title=No cassettes for this pull request::It comes from $from, and GitHub gives it no secrets, so the release app cannot read $GITHUB_REPOSITORY_OWNER/$repo, where pubtest's cassettes are, and the suite cannot run. The job fails rather than pass untested: a maintainer runs the suite by pushing the branch to $GITHUB_REPOSITORY and opening the pull request from there."
            exit 1
          fi
          missing=$([ "$HAS_ID" = true ] || printf 'RELEASE_APP_ID '; [ "$HAS_KEY" = true ] || printf 'RELEASE_APP_KEY')
          echo "::error title=The release app's credentials did not reach this job::Missing: ${missing% }. pubrules.json's \"pubtest\": {\"cassettes\": true} reads pubtest's cassettes from the private $GITHUB_REPOSITORY_OWNER/$repo with the release app: its id (a secret or a variable) as RELEASE_APP_ID and its private key (a secret) as RELEASE_APP_KEY. Set them as organization secrets that reach this repository (on GitHub Free those reach public repositories only), or on this repository with ./with-secrets ./pubsec app-secrets, from a github_app block whose id goes to RELEASE_APP_ID and key to RELEASE_APP_KEY."
          exit 1
        env:
          HEAD: '${{ github.event.pull_request.head.repo.full_name || github.repository }}'
          ACTOR: '${{ github.actor }}'
          HAS_ID: ${{ secrets.RELEASE_APP_ID != '' }}
          HAS_KEY: ${{ secrets.RELEASE_APP_KEY != '' }}
      - if: inputs.data-repo
        id: data-token
        name: Mint the release app's token, which can only read the data repository
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: '${{ secrets.RELEASE_APP_ID }}'
          private-key: '${{ secrets.RELEASE_APP_KEY }}'
          owner: '${{ github.repository_owner }}'
          repositories: '${{ steps.data.outputs.repo }}'
          permission-contents: read
      # actions/checkout keeps a path inside the workspace: the data repository
      # is checked out there, then moved beside it.
      - if: inputs.data-repo && steps.data-token.outcome == 'success'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: '${{ github.repository_owner }}/${{ steps.data.outputs.repo }}'
          token: '${{ steps.data-token.outputs.token }}'
          path: .pubrules-data
          persist-credentials: false
      - if: inputs.data-repo
        name: Put the data repository beside the checkout, where pubtest looks
        run: |
          if [ "$TOKEN" != success ]; then
            echo "::error title=No data repository::The release app could not read $GITHUB_REPOSITORY_OWNER/$REPO: there is no such repository, or the app is not installed on it. pubtest record --all --create-data-repo creates it, private, from a checkout beside it; then the app's installation must include it."
            exit 1
          fi
          beside="$(dirname "$GITHUB_WORKSPACE")/$(basename "$GITHUB_WORKSPACE")-data"
          rm -rf "$beside"
          mv .pubrules-data "$beside"
          echo "pubtest's cassettes: $beside/integrations/cassettes"
        env:
          TOKEN: '${{ steps.data-token.outcome }}'
          REPO: '${{ steps.data.outputs.repo }}'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ inputs.node-version }}' }
      - if: inputs.sync-check
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ inputs.python-version }}' }
      - if: inputs.sync-check
        run: |
          python -m venv .venv
          # Tried three times, then from the wheel mirror: a release download can time out.
          tests/install-lock .venv/bin/pip
          .venv/bin/pubrules sync --check
      - if: inputs.apt-packages != ''
        name: Install the apt packages, kept in the Actions cache
        uses: Sustenaut/pubactions/actions/apt-install@b7e6571d667eaf4a2750e97691d55429d768ac9c # v0.1.0
        with: { packages: '${{ inputs.apt-packages }}' }
      - name: Set up, tried three times (a release download can time out)
        uses: Sustenaut/pubactions/actions/retry@b7e6571d667eaf4a2750e97691d55429d768ac9c # v0.1.0
        with: { run: '${{ inputs.setup }}' }
      # Each property test (Hypothesis, fast-check) tries PUBRULES_FUZZ_RUNS
      # inputs. A scheduled run tries more, unless pubrules.json sets
      # "security": { "fuzz": { "node": false } }.
      - run: |
          runs=$SHORT
          if [ "$EVENT" = schedule ] && [ "$(jq '.security.fuzz | (if type == "object" then .node else . end) != false' pubrules.json 2>/dev/null || echo true)" = true ]; then
            runs=$LONG
          fi
          echo "PUBRULES_FUZZ_RUNS=$runs" >> "$GITHUB_ENV"
        env:
          EVENT: '${{ github.event_name }}'
          SHORT: '${{ inputs.fuzz-runs }}'
          LONG: '${{ inputs.fuzz-runs-scheduled }}'
      - run: ${{ inputs.test }}
      # The sonar job runs elsewhere, so the report goes to it as an artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: coverage
          path: ${{ inputs.coverage-report }}
          if-no-files-found: ignore
          retention-days: 1

  browser:
    if: inputs.browser-test != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # pubrules.json's "pubtest": {"cassettes": true}: pubtest's cassettes are
      # in the private <owner>/<repo>-data, which pubtest reads beside the
      # checkout, as on a developer's machine. The release app reads it, with a
      # token for that one repository that can only read its contents. A pull
      # request from a fork, or Dependabot's, gets no secrets, so the job fails
      # saying why rather than pass a suite it could not run.
      - if: inputs.data-repo
        id: data
        name: Check the release app can reach the data repository
        run: |
          repo="${GITHUB_REPOSITORY#*/}-data"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          [ "$HAS_ID" = true ] && [ "$HAS_KEY" = true ] && exit 0
          from=
          if [ "$HEAD" != "$GITHUB_REPOSITORY" ]; then from="the fork $HEAD"
          elif [ "$ACTOR" = 'dependabot[bot]' ]; then from=Dependabot; fi
          if [ -n "$from" ]; then
            echo "::error title=No cassettes for this pull request::It comes from $from, and GitHub gives it no secrets, so the release app cannot read $GITHUB_REPOSITORY_OWNER/$repo, where pubtest's cassettes are, and the suite cannot run. The job fails rather than pass untested: a maintainer runs the suite by pushing the branch to $GITHUB_REPOSITORY and opening the pull request from there."
            exit 1
          fi
          missing=$([ "$HAS_ID" = true ] || printf 'RELEASE_APP_ID '; [ "$HAS_KEY" = true ] || printf 'RELEASE_APP_KEY')
          echo "::error title=The release app's credentials did not reach this job::Missing: ${missing% }. pubrules.json's \"pubtest\": {\"cassettes\": true} reads pubtest's cassettes from the private $GITHUB_REPOSITORY_OWNER/$repo with the release app: its id (a secret or a variable) as RELEASE_APP_ID and its private key (a secret) as RELEASE_APP_KEY. Set them as organization secrets that reach this repository (on GitHub Free those reach public repositories only), or on this repository with ./with-secrets ./pubsec app-secrets, from a github_app block whose id goes to RELEASE_APP_ID and key to RELEASE_APP_KEY."
          exit 1
        env:
          HEAD: '${{ github.event.pull_request.head.repo.full_name || github.repository }}'
          ACTOR: '${{ github.actor }}'
          HAS_ID: ${{ secrets.RELEASE_APP_ID != '' }}
          HAS_KEY: ${{ secrets.RELEASE_APP_KEY != '' }}
      - if: inputs.data-repo
        id: data-token
        name: Mint the release app's token, which can only read the data repository
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: '${{ secrets.RELEASE_APP_ID }}'
          private-key: '${{ secrets.RELEASE_APP_KEY }}'
          owner: '${{ github.repository_owner }}'
          repositories: '${{ steps.data.outputs.repo }}'
          permission-contents: read
      # actions/checkout keeps a path inside the workspace: the data repository
      # is checked out there, then moved beside it.
      - if: inputs.data-repo && steps.data-token.outcome == 'success'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: '${{ github.repository_owner }}/${{ steps.data.outputs.repo }}'
          token: '${{ steps.data-token.outputs.token }}'
          path: .pubrules-data
          persist-credentials: false
      - if: inputs.data-repo
        name: Put the data repository beside the checkout, where pubtest looks
        run: |
          if [ "$TOKEN" != success ]; then
            echo "::error title=No data repository::The release app could not read $GITHUB_REPOSITORY_OWNER/$REPO: there is no such repository, or the app is not installed on it. pubtest record --all --create-data-repo creates it, private, from a checkout beside it; then the app's installation must include it."
            exit 1
          fi
          beside="$(dirname "$GITHUB_WORKSPACE")/$(basename "$GITHUB_WORKSPACE")-data"
          rm -rf "$beside"
          mv .pubrules-data "$beside"
          echo "pubtest's cassettes: $beside/integrations/cassettes"
        env:
          TOKEN: '${{ steps.data-token.outcome }}'
          REPO: '${{ steps.data.outputs.repo }}'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ inputs.node-version }}' }
      - if: inputs.apt-packages != ''
        name: Install the apt packages, kept in the Actions cache
        uses: Sustenaut/pubactions/actions/apt-install@b7e6571d667eaf4a2750e97691d55429d768ac9c # v0.1.0
        with: { packages: '${{ inputs.apt-packages }}' }
      - name: Set up, tried three times (a release download can time out)
        uses: Sustenaut/pubactions/actions/retry@b7e6571d667eaf4a2750e97691d55429d768ac9c # v0.1.0
        with: { run: '${{ inputs.setup }}' }
      - run: ${{ inputs.browser-setup }}
      - run: ${{ inputs.browser-test }}
      # Its coverage joins the test job's, as an artifact of its own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: coverage-browser
          path: ${{ inputs.browser-coverage-report }}
          if-no-files-found: ignore
          retention-days: 1

  # Every package in package-lock.json against npm's advisory database,
  # without installing anything.
  audit:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ inputs.node-version }}' }
      - run: npm audit --package-lock-only --audit-level=low

  # Every lockfile the repository commits (Cargo.lock, package-lock.json,
  # the hash-locked pip requirements) against the OSV database, which
  # gathers the RustSec, GitHub, PyPI and npm advisories, on every run. It
  # has no switch. The lockfiles are named rather than found by a recursive
  # scan, which would read a requirements.txt's lower bounds as pins.
  osv:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: locks
        run: |
          {
            echo 'args<<EOF'
            git ls-files '*Cargo.lock' '*package-lock.json' \
              | sed 's/^/--lockfile=/'
            git ls-files '*requirements.lock' | sed 's/^/--lockfile=requirements.txt:/'
            echo EOF
          } >> "$GITHUB_OUTPUT"
          git ls-files '*Cargo.lock' '*package-lock.json' '*requirements.lock' | grep -q . \
            && echo "found=true" >> "$GITHUB_OUTPUT" \
            || echo "::notice::No lockfile is committed, so OSV-Scanner has nothing to scan."
      - if: steps.locks.outputs.found == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: ${{ steps.locks.outputs.args }}

  # A pull request that adds or moves a dependency to a version with a
  # known vulnerability fails here, before it merges. GitHub's dependency
  # graph serves it for public repositories only.
  review:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ${{ inputs.runs-on }}
    steps:
      # The owner's own reusable workflows and actions carry no license
      # GitHub can read, so they are left out of the license check alone,
      # each by name: v5.0.0 matches a purl's full name, with no wildcard.
      # `pubrules sync` lists those the repository calls in
      # .github/dependency-review-licenses.txt; without it, pubrules' and
      # pubrel's are. Only the owner's are taken from the file, which a pull
      # request may change. Advisories still apply to them, and everything
      # else is checked as before.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false, sparse-checkout: .github }
      - id: exceptions
        run: |
          file=.github/dependency-review-licenses.txt
          if [ -f "$file" ]; then
            purls=$(grep -E "^pkg:githubactions/$OWNER/[^,[:space:]]+$" "$file" | paste -sd, - || true)
          else
            purls=$(printf '%s' "$DEFAULT" | tr -d ' \n')
          fi
          echo "purls=$purls" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
          DEFAULT: >-
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/service-needs.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-node-audit.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-node-browser.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-node-test.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-osv.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-python-audit.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-python-browser.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-python-functional.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-python-lint.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-review.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-rust-audit.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-rust-cross.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-rust-functional.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-rust-fuzz.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-rust-gates.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-rust-msrv.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-rust-test.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-rust-toolchains.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-service-checks.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-service-terraform.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-service-tests.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-sonar.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/job-tested.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/node-ci.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/python-ci.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/rust-ci.yml,
              pkg:githubactions/Sustenaut/pubrules/.github/workflows/service-ci.yml,
              pkg:githubactions/Sustenaut/pubrules/actions/cache,
              pkg:githubactions/Sustenaut/pubactions/actions/apt-install,
              pkg:githubactions/Sustenaut/pubactions/actions/pr-label,
              pkg:githubactions/Sustenaut/pubactions/actions/retry,
              pkg:githubactions/Sustenaut/pubactions/actions/terraform-init,
              pkg:githubactions/Sustenaut/pubrel/.github/workflows/release.yml
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-dependencies-licenses: ${{ steps.exceptions.outputs.purls }}

  # SonarQube Cloud's analysis, into the project OWNER_REPO of the
  # organization OWNER, when the caller passes a SONAR_TOKEN. Without one, as
  # in a private repository or a pull request from a fork, it says so and
  # passes. The full history lets it tell new code from old, and the
  # coverage reports the test and browser jobs wrote, if any, give the
  # coverage SonarQube Cloud's quality gate asks of new code. Each report
  # arrives in coverage-download/<artifact>/.
  sonar:
    needs: [test, browser]
    # It waits for the browser job too, so the browser tests' coverage
    # counts; when no browser-test was asked for, that job is skipped.
    if: always() && needs.test.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.browser.result)
    runs-on: ${{ inputs.runs-on }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        # A pull request from a fork gets no secrets, by design: a notice.
        # Anything else got none because the caller passed none: a warning
        # naming the usual cause, since the job still passes.
        run: |
          if [ "$FORK" = true ]; then
            echo "::notice::No SONAR_TOKEN was passed, so SonarQube Cloud did not analyse this commit."
          else
            echo "::warning::No SONAR_TOKEN reached the sonar job, so SonarQube Cloud did not analyse this commit. Either the repository (or its organization) has no SONAR_TOKEN secret, or the caller passes it with secrets: inherit to a workflow of another owner, which GitHub drops; pass SONAR_TOKEN by name under the job's secrets."
          fi
        env: { FORK: '${{ github.event.pull_request.head.repo.fork || false }}' }
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: coverage*
          path: coverage-download
      # The reports keep the file names the test commands gave them.
      - if: env.SONAR_TOKEN != ''
        id: report
        run: echo "paths=$(find coverage-download -type f 2>/dev/null | paste -sd, -)" >> "$GITHUB_OUTPUT"
      # Properties pubrules.json adds (security.sonar.args), after the input's.
      - if: env.SONAR_TOKEN != ''
        id: settings
        # The organization: security.sonar.organization, or the owner in
        # lower case, since SonarQube Cloud's organization keys are.
        run: |
          echo "args=$(jq -r '.security.sonar.args // ""' pubrules.json 2>/dev/null)" >> "$GITHUB_OUTPUT"
          organization=$(jq -r '.security.sonar.organization // ""' pubrules.json 2>/dev/null || true)
          echo "organization=${organization:-${OWNER,,}}" >> "$GITHUB_OUTPUT"
        env: { OWNER: '${{ github.repository_owner }}' }
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: >-
            -Dsonar.organization=${{ steps.settings.outputs.organization }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.javascript.lcov.reportPaths=${{ steps.report.outputs.paths }}
            ${{ inputs.sonar-args }}
            ${{ steps.settings.outputs.args }}

  # The one check a ruleset requires. A skipped job counts as passing a
  # required check, so this job always runs and passes only if every job it
  # needs succeeded -- the browser job may be skipped only when no
  # browser-test was asked for, and the review job off a public pull
  # request.
  passed:
    if: always()
    needs: [test, browser, audit, osv, review, sonar]
    runs-on: ${{ inputs.runs-on }}
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg browser "$BROWSER" '
            all(to_entries[];
                .value.result == "success"
                or (.key == "browser" and $browser == "" and .value.result == "skipped")
                or (.key == "review" and .value.result == "skipped"))' > /dev/null
        env:
          RESULTS: '${{ toJSON(needs) }}'
          BROWSER: '${{ inputs.browser-test }}'

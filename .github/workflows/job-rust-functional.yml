# Rust: the functional targets the Rust crate standard requires, which
# `pubrules sync` gives, then the repository's own. With a SONAR_TOKEN
# (passed by name) it runs `make coverage` in place of `make
# functional`: the same suite, and the Rust tests, on a build cargo-llvm-cov
# instruments, whose report goes to the sonar job as the `coverage`
# artifact.
#
# One job of the CI `pubrules sync` writes from the ci block of pubrules.json
# (src/pubrules/ci.py), so a repository runs only the jobs it asks for and
# none shows as skipped.
name: job-rust-functional

on:
  workflow_call:
    inputs:
      runs-on: { type: string, default: ubuntu-latest, description: "The runner label the job runs on, from pubrules.json's ci.runs-on: a self-hosted runner scale set, or GitHub's ubuntu-latest." }
      python-version: { type: string, default: '3.14' }
      apt-packages: { type: string, default: '', description: Extra Ubuntu packages for the functional job. }
      tools: { type: string, default: '', description: 'JSON list of the tools the functional suite drives, each {"crate", "git", "tag"}, which pubrules sync gives from ci.tools; empty installs none.' }
      functional: { type: string, default: '', description: "Extra make targets the functional job runs after the required ones." }
      cargo-llvm-cov-version: { type: string, default: 0.9.1, description: "The cargo-llvm-cov the functional job measures coverage with, when there is a SONAR_TOKEN." }
      required: { type: string, default: '', description: "The make targets the standard requires, which pubrules sync gives." }
      data-repo: { type: boolean, default: false, description: "Check out the private <owner>/<repo>-data beside the checkout, where pubtest finds its cassettes, with a read-only token of the data reader app (DATA_APP_CLIENT_ID, DATA_APP_KEY); pubrules sync gives it from pubrules.json's \"pubtest\": {\"cassettes\": true}." }
    secrets:
      SONAR_TOKEN: { required: false, description: "A SonarQube Cloud token: with one, the suite runs under cargo-llvm-cov and its report goes to the sonar job. Pass it by name: secrets: inherit does not reach a workflow of another owner." }
      DATA_APP_CLIENT_ID: { required: false, description: "The data reader GitHub App's client id (Iv...): with DATA_APP_KEY, it reads the data repository when data-repo is true. Pass it by name." }
      DATA_APP_KEY: { required: false, description: "The data reader GitHub App's private key (PEM)." }

env:
  CARGO_TERM_COLOR: always

jobs:
  functional:
    runs-on: ${{ inputs.runs-on }}
    env:
      # Measure coverage only when there is a scan to send it to; the token
      # itself stays out of this job.
      COVERAGE: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # pubrules.json's "pubtest": {"cassettes": true}: pubtest's cassettes are
      # in the private <owner>/<repo>-data, which pubtest reads beside the
      # checkout, as on a developer's machine. The data reader app reads it
      # (contents and metadata read, nothing else), with a token for that one
      # repository that can only read its contents. A pull request from a
      # fork, or Dependabot's, gets no secrets, so the job fails saying why
      # rather than pass a suite it could not run.
      - if: inputs.data-repo
        id: data
        name: Check the data reader app can reach the data repository
        run: |
          repo="${GITHUB_REPOSITORY#*/}-data"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          if [ -n "$CLIENT_ID" ] && [ "$HAS_KEY" = true ]; then
            [[ "$CLIENT_ID" =~ ^Iv[A-Za-z0-9.]{4,}$ ]] && exit 0
            echo "::error title=DATA_APP_CLIENT_ID is not a client id::DATA_APP_CLIENT_ID must be the data reader app's client id, which starts Iv, then letters, digits and ., not its numeric app id."
            exit 1
          fi
          from=
          if [ "$HEAD" != "$GITHUB_REPOSITORY" ]; then from="the fork $HEAD"
          elif [ "$ACTOR" = 'dependabot[bot]' ]; then from=Dependabot; fi
          if [ -n "$from" ]; then
            echo "::error title=No cassettes for this pull request::It comes from $from, and GitHub gives it no secrets, so the data reader app cannot read $GITHUB_REPOSITORY_OWNER/$repo, where pubtest's cassettes are, and the suite cannot run. The job fails rather than pass untested: a maintainer runs the suite by pushing the branch to $GITHUB_REPOSITORY and opening the pull request from there."
            exit 1
          fi
          missing=$([ -n "$CLIENT_ID" ] || printf 'DATA_APP_CLIENT_ID '; [ "$HAS_KEY" = true ] || printf 'DATA_APP_KEY')
          echo "::error title=The data reader app's credentials did not reach this job::Missing: ${missing% }. pubrules.json's \"pubtest\": {\"cassettes\": true} reads pubtest's cassettes from the private $GITHUB_REPOSITORY_OWNER/$repo with the data reader app: its client id (a secret or a variable, starting Iv) as DATA_APP_CLIENT_ID and its private key (a secret) as DATA_APP_KEY. Set them as organization secrets selected for this repository, or on this repository with ./with-secrets ./pubsec app-secrets, from a github_app block whose client_id goes to DATA_APP_CLIENT_ID and key to DATA_APP_KEY."
          exit 1
        env:
          HEAD: '${{ github.event.pull_request.head.repo.full_name || github.repository }}'
          ACTOR: '${{ github.actor }}'
          CLIENT_ID: ${{ secrets.DATA_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.DATA_APP_KEY != '' }}
      - if: inputs.data-repo
        id: data-token
        name: Mint the data reader app's token, which can only read the data repository
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: '${{ secrets.DATA_APP_CLIENT_ID }}'
          private-key: '${{ secrets.DATA_APP_KEY }}'
          owner: '${{ github.repository_owner }}'
          repositories: '${{ steps.data.outputs.repo }}'
          permission-contents: read
      # actions/checkout keeps a path inside the workspace: the data repository
      # is checked out there, then moved beside it.
      - if: inputs.data-repo && steps.data-token.outcome == 'success'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: '${{ github.repository_owner }}/${{ steps.data.outputs.repo }}'
          token: '${{ steps.data-token.outputs.token }}'
          path: .pubrules-data
          persist-credentials: false
      - if: inputs.data-repo
        name: Put the data repository beside the checkout, where pubtest looks
        run: |
          if [ "$TOKEN" != success ]; then
            echo "::error title=No data repository::The data reader app could not read $GITHUB_REPOSITORY_OWNER/$REPO: there is no such repository, or the app is not installed on it. pubtest record --all --create-data-repo creates it, private, from a checkout beside it; then the app's installation must include it."
            exit 1
          fi
          beside="$(dirname "$GITHUB_WORKSPACE")/$(basename "$GITHUB_WORKSPACE")-data"
          rm -rf "$beside"
          mv .pubrules-data "$beside"
          echo "pubtest's cassettes: $beside/integrations/cassettes"
        env:
          TOKEN: '${{ steps.data-token.outcome }}'
          REPO: '${{ steps.data.outputs.repo }}'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ inputs.python-version }}' }
      - if: inputs.apt-packages != ''
        name: Install the apt packages, kept in the Actions cache
        uses: Sustenaut/pubactions/actions/apt-install@b7e6571d667eaf4a2750e97691d55429d768ac9c # v0.1.0
        with: { packages: '${{ inputs.apt-packages }}' }
      - if: inputs.tools != ''
        id: tools
        run: |
          echo "key=$(printf %s "$TOOLS" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
        env: { TOOLS: '${{ inputs.tools }}' }
      - if: inputs.tools != ''
        id: tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ~/.cargo-tools
          key: tools-${{ steps.tools.outputs.key }}-${{ runner.os }}
      - if: inputs.tools != '' && steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          jq -r '.[] | [.crate, .git, .tag] | @tsv' <<<"$TOOLS" | while IFS=$'\t' read -r crate git tag; do
            cargo install --locked --root "$HOME/.cargo-tools" --git "$git" --tag "$tag" "$crate"
          done
        env: { TOOLS: '${{ inputs.tools }}' }
      - if: env.COVERAGE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ inputs.cargo-llvm-cov-version }}-${{ runner.os }}
      - if: env.COVERAGE == 'true'
        run: |
          rustup component add llvm-tools-preview
          command -v cargo-llvm-cov >/dev/null && cargo llvm-cov --version | grep -q " ${VERSION}$" \
            || cargo install --locked cargo-llvm-cov --version "$VERSION"
        env: { VERSION: '${{ inputs.cargo-llvm-cov-version }}' }
      - run: make venv
      - run: |
          for target in $(printf '%s\n' $REQUIRED $EXTRA | awk 'NF && !seen[$0]++'); do
            if [[ "$target" = functional && "$COVERAGE" = true ]]; then target=coverage; fi
            echo "::group::make $target"; make "$target"; echo "::endgroup::"
          done
        env: { REQUIRED: '${{ inputs.required }}', EXTRA: '${{ inputs.functional }}' }
      # The sonar job runs elsewhere, so the reports go to it as an artifact:
      # the LCOV of `make coverage`, and any Cobertura XML a functional target
      # wrote in coverage/, such as the coverage of a repository's Python.
      - if: env.COVERAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/*.xml
          if-no-files-found: ignore
          retention-days: 1
